name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [master, fix/lnreader-extension-compatibility, integration/lnreader-progress-merge]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  # Keep master and pull-request builds from blocking one another.
  group: quicknovel-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests and build debug APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      # Publish the built APK immediately. The emulator test must not prevent
      # retrieval of a compiled build if emulator startup or instrumentation hangs.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuickNovel-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Run QuickStream reader smoke test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 20
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: ./gradlew --no-daemon --stacktrace :app:connectedDebugAndroidTest

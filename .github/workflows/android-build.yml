name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [master, fix/lnreader-extension-compatibility, integration/lnreader-progress-merge]
  pull_request:
    branches: [master]

permissions:
  contents: read

# A push and its matching pull_request event target the same branch. Share one
# concurrency group so GitHub does not run two expensive Android emulators for
# the same commit; the newest event still verifies the exact same head SHA.
concurrency:
  group: quicknovel-android-build-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests and build debug APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuickNovel-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Run QuickStream reader smoke test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 15
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            timeout 180s sh -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\\r")" = "1" ]; do sleep 2; done'
            adb shell settings put global animator_duration_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global window_animation_scale 0
            timeout 8m ./gradlew --no-daemon --stacktrace :app:connectedDebugAndroidTest

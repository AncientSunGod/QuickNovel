name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [master, fix/lnreader-extension-compatibility]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  # Keep master and pull-request builds from blocking one another.
  group: quicknovel-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests and build debug APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuickNovel-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

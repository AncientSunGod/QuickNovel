version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      android-and-kotlin:
        patterns:
          - "com.android.tools.build:*"
          - "org.jetbrains.kotlin:*"
          - "androidx.*"
      test-libraries:
        patterns:
          - "*test*"
          - "junit"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
